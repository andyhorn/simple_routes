name: Publish to pub.dev

# Tag pushes are the only trigger: release-please pushes one tag per package
# it bumps, and each run publishes every package that isn't live yet (melos
# --no-published skips ones that are), so redundant concurrent runs converge
# on the same end state instead of racing. Manual re-runs must use
# `gh run rerun`; a workflow_dispatch run has no tag context, so that trigger
# stays off.

on:
  push:
    tags:
      - 'simple_routes-v[0-9]*'
      - 'simple_routes_annotations-v[0-9]*'
      - 'simple_routes_generator-v[0-9]*'

concurrency:
  group: pub-dev-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pub.dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d
      - name: Load GCP WIF config from 1Password
        id: op
        uses: 1password/load-secrets-action@v5
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          GCP_WIF_PROVIDER: "op://simple_routes/gcp/GCP_WIF_PROVIDER"
          PUB_SA_EMAIL: "op://simple_routes/gcp/PUB_SA_EMAIL"
      - name: Authenticate to GCP via Workload Identity Federation
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ steps.op.outputs.GCP_WIF_PROVIDER }}
          service_account: ${{ steps.op.outputs.PUB_SA_EMAIL }}
          token_format: id_token
          id_token_audience: https://pub.dev
          id_token_include_email: true
      - name: Add pub.dev credentials
        run: echo '${{ steps.auth.outputs.id_token }}' | dart pub token add https://pub.dev
      - uses: kuhnroyal/flutter-fvm-config-action/setup@v3
      - name: Configure Melos SDK path
        run: ln -s "$FLUTTER_ROOT" .fvm/flutter_sdk
      - name: Restore packages
        run: |
          dart pub global activate melos
          melos bootstrap
      - name: Test
        run: melos run test
      - name: Check pub.dev auth
        run: .github/scripts/check-pub-auth.sh
      # simple_routes and simple_routes_generator both depend on
      # simple_routes_annotations, sometimes on a version only just bumped in
      # this same release. Publishing it alone first and waiting for pub.dev
      # to index it avoids the dependents' `dart pub publish` resolution
      # failing against a version pub.dev doesn't know about yet.
      - name: Publish simple_routes_annotations
        run: |
          melos publish --scope=simple_routes_annotations --no-published --dry-run --yes
          melos publish --scope=simple_routes_annotations --no-published --no-dry-run --yes
      - name: Wait for simple_routes_annotations to be live
        run: .github/scripts/wait-for-live.sh simple_routes_annotations
      - name: Publish dependent packages
        run: |
          melos publish --scope=simple_routes --scope=simple_routes_generator --no-published --dry-run --yes
          melos publish --scope=simple_routes --scope=simple_routes_generator --no-published --no-dry-run --yes
