name: Publish to pub.dev

# Tag pushes carry the git ref that pub.dev's tag-pattern filter validates
# against the OIDC token. Manual re-runs must use `gh run rerun`, which
# reuses the original run's tag context; a workflow_dispatch run has no tag
# and pub.dev would reject it, so the trigger stays off.

on:
  push:
    tags:
      - 'simple_routes-v[0-9]*'
      - 'simple_routes_annotations-v[0-9]*'
      - 'simple_routes_generator-v[0-9]*'

concurrency:
  group: pub-dev-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pub.dev
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: kuhnroyal/flutter-fvm-config-action/setup@v3
      - name: Configure Melos SDK path
        run: ln -s "$FLUTTER_ROOT" .fvm/flutter_sdk
      - name: Restore packages
        run: |
          dart pub global activate melos
          melos bootstrap
      - name: Test
        run: melos run test
      - name: Check GitHub OIDC availability
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::GitHub OIDC is unavailable. Keep 'permissions: id-token: write' on this job and configure 'Automated publishing' on pub.dev for each package (repository andyhorn/simple_routes, workflow publish.yaml)."
            exit 1
          fi
      - name: Publish packages in dependency order
        run: |
          set -euo pipefail
          for name in simple_routes_annotations simple_routes simple_routes_generator; do
            dir="packages/$name"
            version="$(sed -n 's/^version: *//p' "$dir/pubspec.yaml")"
            if curl -fsS "https://pub.dev/api/packages/$name" | jq -e --arg v "$version" 'any(.versions[]?.version; . == $v)' > /dev/null; then
              echo "$name@$version is already on pub.dev, skipping"
              continue
            fi
            echo "Publishing $name@$version"
            (cd "$dir" && timeout 5m dart pub publish --force)
            sleep 15
          done
