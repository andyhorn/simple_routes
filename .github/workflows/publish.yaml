name: Publish to pub.dev

# Tag pushes carry the git ref that pub.dev's tag-pattern filter validates
# against the OIDC token. Manual re-runs must use `gh run rerun`, which
# reuses the original run's tag context; a workflow_dispatch run has no tag
# and pub.dev would reject it, so the trigger stays off.

on:
  push:
    tags:
      - 'simple_routes-v[0-9]*'
      - 'simple_routes_annotations-v[0-9]*'
      - 'simple_routes_generator-v[0-9]*'

concurrency:
  group: pub-dev-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pub.dev
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # Provisions the OIDC token dart pub needs to authenticate with pub.dev.
      # Must run before the Flutter setup: Flutter's dart then shadows the
      # standalone one on PATH, mirroring dart-lang/setup-dart's publish
      # workflow. Without this, dart pub falls back to interactive OAuth and
      # hangs in CI.
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d
      - uses: kuhnroyal/flutter-fvm-config-action/setup@v3
      - name: Configure Melos SDK path
        run: ln -s "$FLUTTER_ROOT" .fvm/flutter_sdk
      - name: Restore packages
        run: |
          dart pub global activate melos
          melos bootstrap
      - name: Test
        run: melos run test
      - name: Check GitHub OIDC availability
        run: .github/scripts/check-oidc.sh
      - name: Publish the tagged package
        run: .github/scripts/publish-package.sh
